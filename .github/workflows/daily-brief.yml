name: Daily Global Macro Morning Brief

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-brief.yml"
      - "config/**"
      - "src/**"
      - "templates/**"
      - "tests/**"
      - "requirements.txt"
      - "pyproject.toml"
  schedule:
    # GitHub Actions cron is UTC. This equals 06:00 Asia/Taipei.
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Generate daily brief
        run: |
          python -m src.main --date today

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports charts data/processed public/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update daily macro morning brief"
            git push
          fi
