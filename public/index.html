<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Macro Morning Brief</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fa; --fg: #17202a; --muted: #5b6773; --panel: #fff; --line: #d5dde5; --accent: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #101214; --fg: #edf2f7; --muted: #a7b0ba; --panel: #181c20; --line: #303840; --accent: #5eead4; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    aside { border-right: 1px solid var(--line); background: var(--panel); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow: auto; }
    main { padding: 24px; overflow-x: hidden; }
    h1 { font-size: 1.2rem; margin: 0 0 18px; }
    a { color: var(--accent); text-decoration: none; }
    .links { display: grid; gap: 8px; }
    .links a { padding: 8px 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; }
    iframe { width: 100%; min-height: calc(100vh - 48px); border: 1px solid var(--line); background: var(--panel); }
    .empty { color: var(--muted); padding: 32px; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h1>Morning Briefs</h1>
      <nav class="links">
        
          <a href="../reports/2026-05-22.html" target="brief-frame">2026-05-22</a>
        
      </nav>
    </aside>
    <main>
      
        <iframe name="brief-frame" src="../reports/2026-05-22.html" title="Latest brief"></iframe>
      
    </main>
  </div>
</body>
</html>
